
services:
  kugou-api:
    image: kugou-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kugou-api
    restart: always
    network_mode: "host"
    
    environment:
      - NODE_ENV=production
      # 在这里强制指定端口为数字，防止 .env 解析错误
      - PORT=3001
      - platform=lite
      
    volumes:
      # 挂载凭证目录（/volume2/dev 为 Drive 同步根，PC 侧 D:\dev 有镜像副本）
      # 凭证唯一权威位置：/volume2/dev/data/api-secrets/musicAPI/kugou_api.env
      # （2026-09-03 凭证按项目归档进 musicAPI/ 子目录，Drive 双向同步，旧根路径已废弃）
      - /volume2/dev/data/api-secrets/musicAPI/kugou_api.env:/app/.env:ro

